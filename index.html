<!DOCTYPE html> 
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Hub - Portale Musicisti</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); }
        .amount-blur { filter: blur(8px); pointer-events: none; user-select: none; }
    </style> 
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const SPREADSHEET_ID = '1fSkpwqDJdoc_7IY1pkTtlhsbUIt-OdiY7Wrh0B0VXSE';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=0`;
        const AUTO_REFRESH_TIME = 60000; 

        const COL_DATA = 0;
        const COL_NOMINATIVO = 1;
        const COL_PASSWORD = 2;
        const COL_EMAIL = 3;
        const COL_NOTE = 4;
        const COL_PREZZO = 5;
        const COL_LUOGO = 6;
        const COL_SALDATO = 7;
        const COL_ACCONTO = 8;

        function App() {
            const [loading, setLoading] = useState(true);
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [showDashboardAmounts, setShowDashboardAmounts] = useState(false);
            const [loginInput, setLoginInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [rememberMe, setRememberMe] = useState(false);
            const [error, setError] = useState(null);
            const [allData, setAllData] = useState([]);
            const [userData, setUserData] = useState(null);
            const [view, setView] = useState('dashboard');
            const [filterSearch, setFilterSearch] = useState('');

            const parseCSV = (text) => {
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                return lines.slice(1).map((line, index) => {
                    const values = [];
                    let current = '', inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        if (char === '"') inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
                        else current += char;
                    }
                    values.push(current.trim());
                    return {
                        _rowIndex: index,
                        _rawValues: values.map(v => v.replace(/^["']|["']$/g, '').trim())
                    };
                });
            };

            const cleanNumber = (valStr) => {
                if (!valStr) return 0;
                let cleanVal = valStr.toString().replace(/[^\d,.-]/g, '').replace(',', '.');
                return parseFloat(cleanVal) || 0;
            };

            const processUserData = useCallback((rows) => {
                if (!rows || rows.length === 0) return null;
                
                let totalLordo = 0;
                let totalAcconti = 0;
                let daPercepire = 0;

                const records = rows.map(row => {
                    const prezzo = cleanNumber(row._rawValues[COL_PREZZO]);
                    const acconto = cleanNumber(row._rawValues[COL_ACCONTO]);
                    const rawSaldato = row._rawValues[COL_SALDATO]?.toUpperCase();
                    const isSaldato = rawSaldato === 'VERO' || rawSaldato === 'TRUE';
                    
                    totalLordo += prezzo;
                    totalAcconti += acconto;

                    const nettoDovuto = prezzo - acconto;
                    if (!isSaldato) daPercepire += nettoDovuto;

                    return {
                        data: row._rawValues[COL_DATA] || 'N/D',
                        localita: row._rawValues[COL_LUOGO] || 'N/D',
                        nota: row._rawValues[COL_NOTE] || '',
                        prezzo,
                        acconto,
                        netto: nettoDovuto,
                        saldato: isSaldato
                    };
                });

                records.sort((a, b) => b.data.localeCompare(a.data));

                return {
                    nome: rows[0]._rawValues[COL_NOMINATIVO],
                    email: rows[0]._rawValues[COL_EMAIL],
                    lordo: totalLordo,
                    acconti: totalAcconti,
                    netto: daPercepire,
                    records,
                    prestazioni: rows.length
                };
            }, []);

            const fetchCSV = async (silent = false) => {
                if (!silent) setLoading(true);
                try {
                    const response = await fetch(`${CSV_URL}&t=${Date.now()}`);
                    const text = await response.text();
                    const parsed = parseCSV(text);
                    setAllData(parsed);
                    
                    if (isLoggedIn && userData) {
                        const updatedRows = parsed.filter(row => 
                            (row._rawValues[COL_EMAIL] || "").toLowerCase() === userData.email.toLowerCase()
                        );
                        if (updatedRows.length > 0) {
                            setUserData(processUserData(updatedRows));
                        }
                    }
                } catch (e) {
                    setError("Errore di connessione al database.");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                const savedEmail = localStorage.getItem('artist_hub_email');
                const savedPass = localStorage.getItem('artist_hub_pass');
                
                if (savedEmail && savedPass) {
                    setLoginInput(savedEmail);
                    setPasswordInput(savedPass);
                    setRememberMe(true);
                }

                fetchCSV();
                const interval = setInterval(() => fetchCSV(true), AUTO_REFRESH_TIME);
                return () => clearInterval(interval);
            }, [isLoggedIn]);

            const handleLogin = (e) => {
                e.preventDefault();
                setError(null);
                
                if (allData.length === 0) {
                    setError("Dati in caricamento, riprova tra un istante...");
                    return;
                }

                const emailInput = loginInput.trim().toLowerCase();
                const passInput = passwordInput.trim();

                const userRows = allData.filter(row => {
                    const dbEmail = (row._rawValues[COL_EMAIL] || "").toLowerCase();
                    const dbPass = row._rawValues[COL_PASSWORD] || "";
                    return dbEmail === emailInput && dbPass === passInput;
                });

                if (userRows.length > 0) {
                    if (rememberMe) {
                        localStorage.setItem('artist_hub_email', emailInput);
                        localStorage.setItem('artist_hub_pass', passInput);
                    }
                    setUserData(processUserData(userRows));
                    setIsLoggedIn(true);
                    setShowDashboardAmounts(false);
                } else {
                    setError("Credenziali non valide.");
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setUserData(null);
                setView('dashboard');
                if (!rememberMe) {
                    setLoginInput('');
                    setPasswordInput('');
                }
            };

            const formatEuro = (num) => num.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });

            // Helper per visualizzare gli importi
            const DisplayAmount = ({ value, isBlurrable = false, isSaldato = false }) => {
                if (isSaldato) return <span>SALDATO</span>;
                const formatted = formatEuro(value);
                const shouldBlur = isBlurrable && !showDashboardAmounts;
                return <span className={shouldBlur ? 'amount-blur' : ''}>{formatted}</span>;
            };

            if (loading && allData.length === 0) return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center">
                    <div className="w-12 h-12 border-4 border-emerald-500/10 border-t-emerald-500 rounded-full animate-spin"></div>
                    <p className="mt-4 text-emerald-500 font-bold text-[10px] tracking-widest uppercase">Caricamento Artist Hub...</p>
                </div>
            );

            if (!isLoggedIn) return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 relative overflow-hidden">
                    <div className="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-emerald-500/5 rounded-full blur-[120px]"></div>
                    <div className="max-w-md w-full bg-slate-900/40 backdrop-blur-2xl p-10 rounded-[2.5rem] border border-white/5 shadow-2xl relative z-10 animate-fade-in">
                        <div className="text-center mb-10">
                            <div className="inline-flex p-3 bg-emerald-500/10 rounded-2xl mb-4 border border-emerald-500/20">
                                <svg className="w-6 h-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>
                            </div>
                            <h1 className="text-3xl font-black text-white uppercase tracking-tighter">Artist Hub</h1>
                            <p className="text-slate-500 text-[10px] font-bold mt-2 uppercase tracking-[0.2em]">Gestione Prestazioni Professionali</p>
                        </div>
                        <form onSubmit={handleLogin} className="space-y-6">
                            <div className="space-y-1.5">
                                <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Email</label>
                                <input type="email" placeholder="latua@email.it" className="w-full p-4 bg-slate-800/40 border border-white/5 rounded-2xl text-white outline-none focus:border-emerald-500/40 transition-all" value={loginInput} onChange={e=>setLoginInput(e.target.value)} required />
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Password</label>
                                <input type="password" placeholder="••••••••" className="w-full p-4 bg-slate-800/40 border border-white/5 rounded-2xl text-white outline-none focus:border-emerald-500/40 transition-all" value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} required />
                            </div>
                            <div className="flex items-center gap-3 px-1" onClick={()=>setRememberMe(!rememberMe)}>
                                <div className={`w-6 h-6 rounded-lg border-2 flex items-center justify-center cursor-pointer transition-all ${rememberMe ? 'bg-emerald-500 border-emerald-500' : 'border-slate-700'}`}>
                                    {rememberMe && <svg className="w-4 h-4 text-slate-900" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>}
                                </div>
                                <span className="text-[10px] text-slate-400 font-black uppercase tracking-tight cursor-pointer">Ricordami</span>
                            </div>
                            {error && <div className="bg-red-500/10 border border-red-500/20 py-3 rounded-xl"><p className="text-red-400 text-[10px] font-black text-center uppercase tracking-wider">{error}</p></div>}
                            <button className="w-full bg-emerald-500 py-4 rounded-2xl font-black uppercase text-xs tracking-[0.2em] text-slate-950 hover:bg-emerald-400 transition-all">Accedi</button>
                        </form>
                    </div>
                </div>
            );

            if (view === 'details') return (
                <div className="min-h-screen bg-slate-50 pb-24 animate-fade-in">
                    <nav className="glass p-4 flex justify-between items-center sticky top-0 z-50 px-6">
                        <button onClick={()=>setView('dashboard')} className="p-2 rounded-xl bg-slate-100 text-slate-600 active:scale-90 transition-all">
                             <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7" /></svg>
                        </button>
                        <h2 className="text-xs font-black text-slate-900 uppercase tracking-widest">Storico Pagamenti</h2>
                        <div className="w-9 h-9"></div>
                    </nav>
                    <div className="p-4 space-y-4 max-w-2xl mx-auto">
                        <div className="relative">
                            <input type="text" placeholder="Cerca luogo..." className="w-full p-4 pl-12 bg-white rounded-2xl border border-slate-200 shadow-sm outline-none focus:ring-2 ring-emerald-500/20" value={filterSearch} onChange={e => setFilterSearch(e.target.value)} />
                            <svg className="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </div>
                        {userData.records.filter(r => r.localita.toLowerCase().includes(filterSearch.toLowerCase())).map((r, i) => (
                            <div key={i} className={`bg-white rounded-3xl p-5 border border-slate-200 card-shadow transition-opacity ${r.saldato ? 'opacity-50' : ''}`}>
                                <div className="flex justify-between items-start mb-3">
                                    <div>
                                        <span className="text-[9px] font-black text-slate-400 uppercase tracking-tighter">{r.data}</span>
                                        <h3 className="font-black text-slate-900 uppercase text-sm">{r.localita}</h3>
                                    </div>
                                    <div className="text-right">
                                        <div className={`text-sm font-black ${r.saldato ? 'text-emerald-500' : 'text-slate-900'}`}>
                                            <DisplayAmount value={r.netto} isSaldato={r.saldato} />
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-3 text-[10px] font-bold text-slate-500 border-t pt-3 border-slate-50">
                                    <span>Lordo: <DisplayAmount value={r.prezzo} /></span>
                                    <span className="text-amber-600">Acconto: <DisplayAmount value={r.acconto} /></span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 pb-24 animate-fade-in">
                    <nav className="glass px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-slate-900 rounded-xl flex items-center justify-center text-white font-black text-xs">A</div>
                            <span className="font-black text-slate-900 uppercase text-xs">Artist Hub</span>
                        </div>
                        <button onClick={handleLogout} className="text-slate-400 hover:text-red-500 transition-colors p-2">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7" /></svg>
                        </button>
                    </nav>

                    <main className="p-5 max-w-2xl mx-auto space-y-6">
                        <div className="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden">
                            <div className="relative z-10">
                                <h2 className="text-3xl font-black uppercase tracking-tighter mb-1">{userData.nome}</h2>
                                <p className="text-slate-500 font-bold text-[10px] uppercase tracking-widest mb-8">{userData.email}</p>
                                <div className="flex gap-4">
                                    <button onClick={()=>setView('details')} className="flex-1 bg-white text-slate-900 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest active:scale-95 transition-all">Vedi Storico</button>
                                    <div className="bg-white/5 px-6 rounded-2xl flex flex-col justify-center border border-white/5">
                                        <span className="text-[7px] font-black text-slate-500 uppercase tracking-tighter">Gigs</span>
                                        <span className="text-xl font-black text-emerald-400">{userData.prestazioni}</span>
                                    </div>
                                </div>
                            </div>
                            <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full -translate-y-1/2 translate-x-1/2 blur-2xl"></div>
                        </div>

                        <div className="p-8 rounded-[2.5rem] shadow-xl card-shadow bg-emerald-400 text-slate-900 relative">
                            <div className="flex justify-between items-start">
                                <span className="text-[10px] font-black uppercase opacity-60 tracking-widest">Netto da Riscuotere</span>
                                <button 
                                    onClick={() => setShowDashboardAmounts(!showDashboardAmounts)} 
                                    className="p-2 bg-slate-900/10 rounded-xl hover:bg-slate-900/20 transition-all active:scale-90"
                                >
                                    {showDashboardAmounts ? (
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                    ) : (
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" /></svg>
                                    )}
                                </button>
                            </div>
                            <div className="flex items-center gap-4 my-2">
                                <p className="text-5xl font-black tracking-tighter">
                                    <DisplayAmount value={userData.netto} isBlurrable={true} />
                                </p>
                            </div>
                            <span className="text-[8px] font-bold uppercase opacity-50 block mt-4">Calcolato su prestazioni non saldate</span>
                        </div>
                        
                        <div className="grid grid-cols-2 gap-4">
                            <div className="bg-white p-6 rounded-[2rem] border border-slate-200 card-shadow text-center">
                                <span className="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1">Lordo Totale</span>
                                <p className="text-lg font-black text-slate-900">
                                    <DisplayAmount value={userData.lordo} isBlurrable={true} />
                                </p>
                            </div>
                            <div className="bg-white p-6 rounded-[2rem] border border-slate-200 card-shadow text-center">
                                <span className="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1">Tot. Acconti</span>
                                <p className="text-lg font-black text-amber-600">
                                    <span className={!showDashboardAmounts ? 'amount-blur' : ''}>-</span>
                                    <DisplayAmount value={userData.acconti} isBlurrable={true} />
                                </p>
                            </div>
                        </div>
                    </main>

                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50">
                        <div className="glass px-8 py-4 rounded-full flex items-center gap-10 card-shadow border border-white/50">
                            <button onClick={()=>setView('dashboard')} className={`p-1 transition-all ${view === 'dashboard' ? 'text-emerald-600 scale-125' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" /></svg>
                            </button>
                            <button onClick={()=>setView('details')} className={`p-1 transition-all ${view === 'details' ? 'text-emerald-600 scale-125' : 'text-slate-400'}`}>
                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
